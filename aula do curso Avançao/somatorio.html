<script>
    //somatoria decrescente
    function fat(x, y){
        if( x == y){
            return x
        }
        calculo = x + fat (x-1, y)
        return calculo
    }

    //somatoria crescente
    function fat2(x, y){
        if( x == y){
            return x
        }
        calculo = x + fat2 (x+1, y)
        return calculo
    }

       a = parseInt( prompt("inicio"))
       b = parseInt( prompt("fim"))

     console.log(c)
