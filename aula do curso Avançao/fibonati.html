for

<script>

function fibonati(f){
 if (f <= 2) {
        return 1
    }
else{
    calculo = fibonati(f -1) + fibonati(f -2)
    return calculo
}
}
function valorum(){
    num = parseInt(prompt("digite um numero "))
    rseultado =  fibonati(num)
    console.log(rseultado)
}

function valordois(num){
    anterior = 1
    atual = 1
    if (num <= 2) {
        return 1
     
        }
    else{
        for(i = 3;i<=num;i++){
            proximo = anterior + atual
            anterior = atual
            atual = proximo
        }

        return atual
        
    }
}

function a(){
    n = parseInt(prompt("digite um numero "))
    ret = valordois(n)

    console.log(ret)

}

function soma (x, y){
    return x + y
}

function retornaFunction(){
    return soma
}

function chama(){

    f =  retornaFunction()

    ret = f(5,8)

    console.log(ret)
}
