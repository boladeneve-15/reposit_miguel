 </details>

</body>

                    modelo: "",

                }
               

    let informacoes = [

    ]
function busca(X) {
   let  posicao = -1
    for(let i=0;i<informacoes.length;i++){

        if(informacoes[i].id == X ){
            return i
        }
       
}
          
          return posicao
        
      console.log(poscao)
}
    



function CREATE(){
 let nome =   Nome.value 
 let marca =  Marca.value
 let tipo =   Tipo.value
 let modelo = Modelo.value
 for(i = acumulador ;i <= i+1 ;i++){
informacoes.push({

break

function READ_ALL() {

}

   let valor = parseInt(VERID.value)
    
    if(busca(valor) != -1){
        console.log(informacoes[valor-1])
    }
    
}
function UPDATE() {
    let  valor = parseInt(REID.value)
    let novonome = RENome.value
    let novamarca = REMarca.value
    let novotipo = RETipo.value
    let novomodelo = REModelo.value

    posicao = busca(valor)
    if (posicao != -1){
        informacoes[posicao] = {
            id:  valor,
            nome: novonome,
            marca: novamarca,
            tipo: novotipo,
            modelo: novomodelo
            
        }

    }

console.log(informacoes)
}
function CANCEL() {
pai.style.display = "none";
meio.style.display = "none";

}
function JANELA(){
     let valor = parseInt(REID.value)
      if(busca(valor) == -1){
         console.log("ERRO ESSE ID NÃO EXISTE")
     }
    if(busca(valor) != -1){
        selecionado.innerHTML = `Selecionado ID ${valor}`
        pai.style.display = "inline";
        meio.style.display = "inline";
}

}

function DELETA(){
 let valor = parseInt(IDEL.value)
 if(busca(valor) == -1){
    console.log("ID NÃO EXISTE")
 }
 if (busca(valor) != -1) {
    informacoes.splice(busca(valor), 1)
    
 }
console.log(informacoes)
}
