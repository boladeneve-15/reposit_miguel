<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="TRABALHO-FINAL.js" defer></script>
    <link rel="stylesheet" href="TRABALHO-FINAL.css">
</head>

<body>
    <h1>TRABALHO-FINAL</h1>
    <h1>TEMA: HARDWARE</h1>
    <h1 style="color: red;" id="aviso"></h1>
  <div id="tabela-container">

        <table id="planilha">

            <thead id="cabecario">

                <tr>
                    <th colspan="5">
                        <button id="sair" onclick="SAIR()">SAIR</button>
                    </th>
                </tr>

                <tr>
                    <th id="IDs">ID</th>
                    <th id="nome">Nome</th>
                    <th id="marca">Marca</th>
                    <th id="tipo">Tipo</th>
                    <th id="modelo">Modelo</th>
                </tr>

            </thead>

            <tbody id="tabela">
            </tbody>

        </table>

    </div>

    <details class="CREATES">
        <summary >  CREATE</summary>
        <div class="linha"></div>
        <input class="CREATEIN"  type="text" placeholder="NOME"   id="Nome"/>
        <input class="CREATEIN"  type="text" placeholder="MARCA"  id="Marca"/>
        <input class="CREATEIN"  type="text" placeholder="TIPO"   id="Tipo"/>
        <input class="CREATEIN"  type="text" placeholder="MODELO" id="Modelo"/>
        <button onclick="CREATE()" class="CREATEBU"> CRIAR</button>
    </details>
    <details class="READ" >
        <summary>
            READ (ID)
        </summary>
        <div class="linha"></div>
        <input  class="READIN"type="number" placeholder="VER PELO ID" id="VERID">
        <button  class="READBU"onclick="READ_ID()">VER PELO ID</button>
    </details>
    <details class="READ">
        <summary>
            READ (ALL)
        </summary>
        <div class="linha"></div>
        <button  class="READBU"onclick="READ_ALL()">VER TODOS CADASTRADOS</button>
    </details>

    <details class="UPDATE">
        <summary>
             UPDATE
        </summary>
        <div class="linha"></div>
        <input class="UPDATEIN" type="number" placeholder="INSIRIR ID PARA ATUALIZAR"  id="REID">
        <button class="UPDATEBU" onclick="JANELA()">APLICAR</button>
        </details><div id="pai">
            <button onclick="CANCEL()">CANCELAR</button>
            <div id="filho">
            <p id="selecionado"></p>
            <input type="text" placeholder="NOME" id="RENome" />
            <input type="text" placeholder="MARCA" id="REMarca" />
            <input type="text" placeholder="TIPO" id="RETipo" />
            <input type="text" placeholder="MODELO" id="REModelo" />
        </div>
    </div>
    <button onclick="UPDATE()" id="meio">ATUALIZAR</button>
 

   <details class="DELETE">
    <summary>
        DELETE
    </summary>

    <div class="linha"></div>

    <input class="DELETEIN" type="number" placeholder="INSIRIR ID PARA DELETAR" id="IDEL">

    <button class="DELETEBU" onclick="DELETA()">DELETAR</button>
</details>
    

</body>

</html>
