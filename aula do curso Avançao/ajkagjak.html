<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="TRABALHO-FINAL.css">
    <style>
       #planilha {
    width: 90%;
    margin: 30px auto;
    color: white;
    font-family: Arial, sans-serif;
    border: 1px solid #444;
    display: none;
}



#colunas {
     display: flex;
    flex-direction: row;
    background-color: #1f2937;
    padding: 12px;
    border-bottom: 1px solid #444;
    box-sizing: border-box;
}

 #numeros {
    width: 180px;
    border-right: 1px solid #333333;


}

#IDs {
    width: 180px;
    border-right: 1px solid #333333;

}

#nome {
    width: 180px;
    border-right: 1px solid #333333;

}

#marca {
    width: 180px;
    border-right: 1px solid #333333;

}

#tipo {
    width: 180px;
    border-right: 1px solid #333333;

}

#modelo {
    width: 180px;


}

#colunas h1,
#colunas h2 {
    margin: 0;
    font-size: 16px;
}
#cabecario th{
      border-bottom: 1px solid #444;

}
#sair{
    color: white;
  background-color: #333333;
  border-radius: 5px;
  height: 25px;
  width: 125px;
  border: 1px, rgb(65, 65, 65), solid;
 transition: 0.5s;
    display: flex;
    align-items: center;
    justify-content: center;
  box-shadow: 1px rgba(245, 246, 250, 0.15); 

}
#sair:hover{
   border: 1px, rgb(65, 65, 65), solid;   border: 1px,rgba(58, 87, 128, 0.459), solid;
  background-color:  #2b2b2b;
  color: #080808; 
    outline: none;
  border-color: #292929; 
  box-shadow: 0 0 0 3px rgba(8, 8, 8, 0.15); 

}
#sair:active{
   transform: scale(0.95);
}
    </style>
</head>
<body>
    <table id="planilha">
        

        <thead id="cabecario">
            <tr>
                <th colspan="5">
                <button id="sair">SAIR</button>
            </th>
                
            </tr>
            <tr>
                <th id="IDs">ID</th>
                <th id="nome">Nome</th>
                <th id="marca">Marca</th>
                <th id="tipo">Tipo</th>
                <th id="modelo">Modelo</th>
            </tr>
        </thead>
    
        
        <tbody id="tabela">
            
    </tbody>

</table>
</body>
</html>
