<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="CSS fudido de bom.css" />
  
  </head>
  <body>
    <h1 id="resultado"></h1>
    <button onclick="megasena()">numeros da mega sena</button>
   
  </body>
  <script>
  
    function megasena() {
      resultado.innerHTML = "";

      lista = [];
      min = 1; 
      max = 60; 
      quant = 6;

      for (i = 0; lista.length < quant; i++) {
        aleatorio = parseInt(Math.random() * (max + 1 - min) + min);
        if (lista.indexOf(aleatorio) == -1) {
          lista.push(aleatorio);
        }
      }

     
    
    lenlista = lista.length - 1;
    extra = 0;
   
        for (k = 0; k < lenlista; k++) {
            minimo = k;
            for (j = k + 1; j <= lenlista; j++) {
                if (lista[j] < lista[minimo]) {
                    minimo = j;
                }
            }
            if (k != minimo) {
                extra = lista[k];
                lista[k] = lista[minimo];
                lista[minimo] = extra;
            }
        }
         resultado.innerHTML = lista.join("-")
    }
  </script>
</html>
