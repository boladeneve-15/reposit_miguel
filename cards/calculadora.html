<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      @view-transition{      
      naigation: auto
      }
        body {
            height: 100vh; 
            margin: 0;
            display: flex;
            justify-content: center; 
            align-items: center;    
        }
        #pai {
            display: flex;
            gap: 10px; 
            border: 1px rgb(0, 0, 0) solid;
            justify-content: space-around;
            align-items: center;
            flex-direction: column;
        }
        /* .colunas {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px; 
        } */
         h1{
            border: 1px, rebeccapurple, solid;
            width: 175px;
            height: 20px;
            margin: 2px;
            font-size:10px;
            flex-direction: row;
            display: flex;
            align-items: center;
         }
    </style>
</head>
<body>

    <!-- calculadora -->
    <div id="pai">
       
            <h1 id="tela"></h1>
            <input type="button" value="1" id="um" onclick="maisum()">
            <input type="button" value="2" id="numero" onclick="maisdois()">
            <input type="button" value="3" id="numero" onclick="maistres()">
        
       
            <input type="button" value="4" id="numero" onclick="maisquatro()">
            <input type="button" value="5" id="numero" onclick="maiscinco()">
            <input type="button" value="6" id="numero" onclick="maisseis()">
        
        
        <div class="colunas">
            <input type="button" value="7" id="numero" onclick="maissete()">
            <input type="button" value="8" id="numero" onclick="maisoito()">
            <input type="button" value="9" id="numero" onclick="maisnove()">
            <input type="button" value="=" id="numero" onclick="igual()">
            <input type="button" value="+" id="numero" onclick="mais()">
            <input type="button" value="-" id="numero" onclick="menos()">
            <input type="button" value="x" id="numero" onclick="vezes()">
        </div>
    </div>
</body>
<script>

  function maisum(){
    tela.innerHTML += 1
  }
  function maisdois (){
    tela.innerHTML += 2
  }
  function maistres(){
    tela.innerHTML += 3
  }
  function maisquatro (){
    tela.innerHTML += 4
  }
  function maiscinco (){
    tela.innerHTML += 5
  }
  function maisseis (){
    tela.innerHTML += 6
  }
  function maissete (){
    tela.innerHTML += 7
  }
  function maisoito (){
    tela.innerHTML += 8
  }
  function maisnove (){
    tela.innerHTML += 9
  }
  function igual (){
    tela.innerHTML += ""
    window.location.href = "card.html"
  }
  function mais (){
    tela.innerHTML += "+"
  }
  function menos (){
    tela.innerHTML += "-"
  }
  function vezes (){
    tela.innerHTML += ""
  }
</script>
</html>
