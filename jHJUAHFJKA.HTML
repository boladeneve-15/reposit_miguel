<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <input type="number" name="" id="numbero">
  <button onclick="a()"> a</button>
</body>
<script>
  function calculo(x){
    let dobro  = x * 2
    return dobro
  }
  function a(){
    let num = numbero.value
    resultado = calculo(num)
    console.log(` o dobro do seu numero (${num}) e ${resultado} `)
  }
</script>
</html>
